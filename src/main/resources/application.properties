spring.application.name=careerTrace-backend

spring.datasource.url=jdbc:mysql://localhost:3306/careertrace?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

spring.config.import=optional:file:.env[.properties]

# ---------- JSON ----------
# 统一响应里值为 null 的字段不输出，与接口文档示例一致
spring.jackson.default-property-inclusion=non_null

# ---------- MyBatis-Plus ----------
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.banner=false

# ---------- 鉴权 ----------
# 测试环境关闭 JWT；上线前改为 true，并设置强随机 JWT_SECRET
career-trace.auth.enabled=false
career-trace.auth.dev-user-id=1
# 生产环境务必通过环境变量 JWT_SECRET 覆盖
career-trace.jwt.secret=${JWT_SECRET:career-trace-dev-secret-0123456789abcdef}
career-trace.jwt.expire-minutes=10080

# ---------- DeepSeek ----------
career-trace.llm.api-key=${DEEPSEEK_API_KEY:}
career-trace.llm.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}
career-trace.llm.model=${DEEPSEEK_MODEL:deepseek-chat}
career-trace.llm.timeout-seconds=90
# 标签抽取约束文档（classpath），更换提示词只需换文件
career-trace.llm.tag-prompt=classpath:prompts/memory-tagging.md
# 打标最多尝试 3 次（首次 + 2 次重试）
career-trace.llm.tag-max-attempts=3
career-trace.llm.tag-retry-backoff-ms=800

# ---------- Embedding（阿里云百炼 text-embedding-v3，OpenAI 兼容接口） ----------
career-trace.embedding.enabled=${EMBEDDING_ENABLED:true}
career-trace.embedding.api-key=${EMBEDDING_MODEL_API_KEY:}
career-trace.embedding.base-url=${EMBEDDING_BASE_URL:}
career-trace.embedding.model=${EMBEDDING_MODEL:text-embedding-v3}
# 留空时从 base-url 推导：去掉 /api/v1 或 /compatible-mode/v1，再拼 compatible-mode/v1/embeddings
career-trace.embedding.endpoint=${EMBEDDING_ENDPOINT:}
career-trace.embedding.timeout-seconds=30
career-trace.embedding.batch-size=10
career-trace.embedding.dimensions=1024
# 语义调用失败后的熔断时间，避免每个推荐请求都等待超时
career-trace.embedding.failure-backoff-seconds=60

# ---------- 推荐参数 ----------
# 结构化匹配满分；语义匹配满分；最高总分 = 85 + 15 = 100
career-trace.match.structured-weight=85
career-trace.match.semantic-weight=15
# 未覆盖岗位要求时的扣分比例（按标签权重折算）
career-trace.match.required-miss-penalty=0.50
career-trace.match.bonus-miss-penalty=0.25
# 语义相似度归一化区间：cos <= floor 记 0 分，>= ceiling 记满分
career-trace.match.semantic-floor=0.55
career-trace.match.semantic-ceiling=0.85

# ---------- Knife4j / OpenAPI ----------
knife4j.enable=true
knife4j.production=false
knife4j.setting.language=zh_cn
knife4j.setting.enable-footer=true
knife4j.setting.enable-document-manage=true
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=com.yuzhijie.career.trace.module
